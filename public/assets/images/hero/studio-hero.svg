<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none">
  <defs>
    <radialGradient id="studioGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 240) rotate(90) scale(420 680)">
      <stop offset="0%" stop-color="#D7FF38" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#38E8FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#101112" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="carBody" x1="180" y1="260" x2="1040" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2B3036"/>
      <stop offset="35%" stop-color="#171A1E"/>
      <stop offset="70%" stop-color="#0E1012"/>
      <stop offset="100%" stop-color="#23272D"/>
    </linearGradient>
    <linearGradient id="limeEdge" x1="200" y1="300" x2="1020" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D7FF38" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#D7FF38" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38E8FF" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="floorReflect" x1="600" y1="520" x2="600" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D7FF38" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#101112" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="#101112"/>
  <rect width="1200" height="760" fill="url(#studioGlow)"/>

  <!-- Studio Ceiling LED Light Bars -->
  <g opacity="0.85">
    <path d="M220 70L450 70L420 92L190 92Z" fill="#F5F5F2" fill-opacity="0.88"/>
    <path d="M510 56L820 56L795 78L485 78Z" fill="#D7FF38" fill-opacity="0.9"/>
    <path d="M870 70L1060 70L1035 92L845 92Z" fill="#F5F5F2" fill-opacity="0.7"/>
  </g>

  <!-- Architectural Studio Grid Lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="535" x2="1200" y2="535"/>
    <line x1="180" y1="0" x2="180" y2="760"/>
    <line x1="600" y1="0" x2="600" y2="760"/>
    <line x1="1020" y1="0" x2="1020" y2="760"/>
  </g>

  <!-- Wet Studio Floor Reflection -->
  <ellipse cx="610" cy="548" rx="470" ry="48" fill="#070809"/>
  <ellipse cx="610" cy="575" rx="410" ry="70" fill="url(#floorReflect)"/>

  <!-- Sleek Dark Automotive Silhouette -->
  <g>
    <!-- Main Coupe/Fastback Body -->
    <path d="M145 458C145 422 172 392 222 378L356 346L486 266C524 244 574 234 646 234H834C892 234 942 254 984 292L1052 350C1080 368 1096 396 1096 432V476C1096 494 1082 506 1062 506H982C974 442 924 402 864 402C804 402 754 442 746 506H456C448 442 398 402 338 402C278 402 228 442 220 506H168C152 506 145 488 145 458Z" fill="url(#carBody)" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>

    <!-- Greenhouse / Tinted Glass Cabin -->
    <path d="M384 344L502 272C534 254 576 248 638 248H814C864 248 906 264 942 298L982 338L384 344Z" fill="#0B0D10" stroke="#F5F5F2" stroke-opacity="0.22" stroke-width="1.5"/>

    <!-- Specular Gloss Highlight Line (Ceramic + Polish Accent) -->
    <path d="M170 402C275 372 410 356 615 354C805 352 958 364 1076 392" stroke="url(#limeEdge)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M368 344L500 266C540 245 585 238 655 238H832" stroke="#F5F5F2" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>

    <!-- LED Headlight Signature -->
    <path d="M162 414L238 398L226 422L158 430Z" fill="#D7FF38"/>
    <path d="M152 418L246 394" stroke="#D7FF38" stroke-width="6" stroke-linecap="round" opacity="0.45"/>

    <!-- Rear Taillight Accent -->
    <path d="M1050 374L1092 384V404L1044 394Z" fill="#FF385C" opacity="0.85"/>

    <!-- Front Wheel -->
    <g transform="translate(338 486)">
      <circle r="72" fill="#0B0C0E" stroke="#2D3238" stroke-width="10"/>
      <circle r="52" fill="#13161A" stroke="#F5F5F2" stroke-opacity="0.3" stroke-width="2"/>
      <circle r="48" stroke="#D7FF38" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="14 8"/>
      <path d="M0 -48V48M-48 0H48M-34 -34L34 34M-34 34L34 -34" stroke="#9B9FA3" stroke-opacity="0.6" stroke-width="4"/>
      <circle r="14" fill="#101112" stroke="#D7FF38" stroke-width="2"/>
    </g>

    <!-- Rear Wheel -->
    <g transform="translate(864 486)">
      <circle r="72" fill="#0B0C0E" stroke="#2D3238" stroke-width="10"/>
      <circle r="52" fill="#13161A" stroke="#F5F5F2" stroke-opacity="0.3" stroke-width="2"/>
      <circle r="48" stroke="#D7FF38" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="14 8"/>
      <path d="M0 -48V48M-48 0H48M-34 -34L34 34M-34 34L34 -34" stroke="#9B9FA3" stroke-opacity="0.6" stroke-width="4"/>
      <circle r="14" fill="#101112" stroke="#D7FF38" stroke-width="2"/>
    </g>
  </g>

  <!-- Hydrophobic Water Beads Overlay Graphic -->
  <g fill="#38E8FF" fill-opacity="0.55">
    <circle cx="445" cy="306" r="3.5"/>
    <circle cx="462" cy="296" r="2.2"/>
    <circle cx="480" cy="310" r="4"/>
    <circle cx="512" cy="292" r="2.8"/>
    <circle cx="534" cy="304" r="3.2"/>
  </g>
</svg>
